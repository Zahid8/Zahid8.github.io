<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Stack Builder 💛</title>
  <style>
    :root{
      --bg1:#0b1020;
      --bg2:#121a33;
      --card:rgba(15,23,48,.78);
      --stroke:rgba(255,255,255,.14);
      --text:#f4f6ff;
      --muted:#b9c0ff;
      --accent:#ffd166;
    }
    html,body{
      height:100%;
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(900px 600px at 70% 10%, #1a2a66 0%, transparent 55%),
        radial-gradient(800px 550px at 20% 80%, #4b1a66 0%, transparent 55%),
        linear-gradient(180deg,var(--bg1),var(--bg2));
      overflow:hidden;
      color:var(--text);
    }
    .wrap{
      height:100%;
      display:grid;
      place-items:center;
      position:relative;
      padding:18px;
    }
    canvas{
      width:min(92vw,820px);
      height:auto;
      max-height:88vh;
      border-radius:22px;
      background: linear-gradient(180deg, #0d1430 0%, #070b18 100%);
      box-shadow: 0 18px 60px rgba(0,0,0,.45);
      border:1px solid rgba(255,255,255,.08);
      touch-action: manipulation;
    }
    .hint{
      position:absolute;
      bottom:14px;
      left:50%;
      transform:translateX(-50%);
      width:min(92vw,820px);
      display:flex;
      justify-content:center;
      pointer-events:none;
    }
    .pill{
      background: var(--card);
      border:1px solid var(--stroke);
      backdrop-filter: blur(10px);
      padding:10px 12px;
      border-radius:999px;
      box-shadow: 0 8px 22px rgba(0,0,0,.22);
      color:var(--muted);
      font-size:13px;
      display:flex;
      gap:8px;
      align-items:center;
    }

    /* ===== WIN / LOSE HTML overlays ===== */
    .overlay{
      position:absolute;
      inset:0;
      display:none;
      place-items:center;
      padding:18px;
      background:
        radial-gradient(900px 600px at 50% 20%, rgba(255,209,102,.16), transparent 60%),
        rgba(0,0,0,.58);
      z-index:10;
    }
    .overlay.show{ display:grid; }

    .card{
      width:min(92vw,720px);
      max-height:min(86vh,820px);
      background: rgba(15,23,48,.88);
      border:1px solid rgba(255,255,255,.14);
      border-radius:24px;
      box-shadow: 0 22px 80px rgba(0,0,0,.55);
      padding:18px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .title{
      font-size:22px;
      font-weight:800;
      margin:0;
      display:flex;
      align-items:center;
      gap:10px;
    }
    .sub{
      margin:0;
      color:var(--muted);
      line-height:1.35;
      font-size:14px;
    }

    .scrollBox{
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      border-radius:18px;
      padding:14px;
      overflow:auto;
      max-height:52vh; /* key part */
      white-space:pre-wrap; /* keeps your line breaks */
      line-height:1.55;
      font-size:15px;
      color: rgba(244,246,255,.95);
    }

    /* nice scrollbar */
    .scrollBox::-webkit-scrollbar{ width:10px; }
    .scrollBox::-webkit-scrollbar-thumb{
      background: rgba(255,255,255,.18);
      border-radius:999px;
      border:2px solid rgba(0,0,0,0);
      background-clip: padding-box;
    }

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .btn{
      all:unset;
      cursor:pointer;
      user-select:none;
      padding:10px 14px;
      border-radius:14px;
      font-weight:750;
      font-size:14px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.08);
      box-shadow: 0 12px 30px rgba(0,0,0,.35);
    }
    .btn:hover{ background: rgba(255,255,255,.12); }
    .btn.primary{
      background: linear-gradient(180deg, rgba(255,209,102,.98), rgba(255,209,102,.82));
      color:#1c1403;
      border:1px solid rgba(255,209,102,.25);
    }
    .tiny{
      margin:0;
      color:rgba(185,192,255,.9);
      font-size:12px;
    }
  </style>
</head>
<body>
<div class="wrap">
  <canvas id="myCanvas" width="800" height="600"></canvas>
  <div class="hint"><div class="pill">Tap / Click to drop a block</div></div>

  <!-- WIN overlay -->
  <div id="winOverlay" class="overlay" role="dialog" aria-modal="true">
    <div class="card">
      <h2 class="title">💛 You did it!</h2>
      <p class="sub">Scroll down to read your surprise message 💌</p>

      <div id="loveBox" class="scrollBox"></div>

      <div class="row">
        <button class="btn" id="copyBtn">Copy message</button>
        <button class="btn primary" id="playAgainBtn">Play again</button>
      </div>
      <p class="tiny">Tip: you can scroll inside the message box.</p>
    </div>
  </div>

  <!-- LOSE overlay (optional, nicer) -->
  <div id="loseOverlay" class="overlay" role="dialog" aria-modal="true">
    <div class="card" style="max-height:none">
      <h2 class="title">💥 Game Over</h2>
      <p class="sub" id="loseText">Click play again to retry.</p>
      <div class="row">
        <button class="btn primary" id="tryAgainBtn">Play again</button>
      </div>
    </div>
  </div>
</div>

<script>
let canvas = document.getElementById("myCanvas");
let context = canvas.getContext("2d");
context.textBaseline = "top";

// --- Customize ---
const WIN_SCORE = 20;
const LOVE_MESSAGE = `You did it my love!

Mei aapse itna zyada pyaar karta hoon ke kabhi kabhi khud samajh nahi paata ke itna kaise ho sakta hai. Aap meri aadat ban chuki hai… aur sach bolun to meri zarurat bhi. Aapse thodi der baat na ho ya kuch minutes door rehna pade, dil ajeeb sa heavy ho jata hai. Aisa lagta hai jese kuch missing ho.
Mene aapko hurt kiya kal, and kuch aisa bola ho jo nahi bolna chahiye tha, I am really really sorry bebu. Mera intention kabhi bhi aapko sad karna nhi tha. Main bas aapse bohot zyada attached hoon.
Mei aap par poora trust karta hoon. From my heart. Mujhe aapse koi doubt nahi hai, kabhi nahi hoga. Bas mei thoda possessive ho jata hoon… kyunki mei aapse itna obsessed hoon, itna pyaar karta hoon ke kabhi kabhi darr lagta hai ke kahi aapko kho na doon. Mei promise karta hoon ke future mei mei apne aap ko better banaunga. Mei try karunga ki mei zyada secure rahun, zyada mature rahun, sirf aapke liye, hamare liye.
You are my world. Aapki smile, aapki awaaz, aapki harkatein, sab kuch mujhe pagal kar deti hai(in a good way). Mei sach mei aapse bohot bohot zyada pyaar karta hoon. Aur hamesha karta rahunga.

Always yours `;
// ----------------

// overlays
const winOverlay = document.getElementById("winOverlay");
const loseOverlay = document.getElementById("loseOverlay");
const loveBox = document.getElementById("loveBox");
const copyBtn = document.getElementById("copyBtn");
const playAgainBtn = document.getElementById("playAgainBtn");
const tryAgainBtn = document.getElementById("tryAgainBtn");
const loseText = document.getElementById("loseText");

// inject message (scrollable!)
loveBox.textContent = LOVE_MESSAGE;

// Game vars (your originals)
let scrollCounter, cameraY, current, mode, xSpeed;
let ySpeed = 5;
let height = 50;
let boxes = [];
boxes[0] = { x: 300, y: 300, width: 200 };

let debris = { x: 0, width: 0, y: 0 };

// Look constants
const GROUND_Y = 600;
const RADIUS = 12;

function roundRect(ctx, x, y, w, h, r){
  const rr = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+rr, y);
  ctx.arcTo(x+w, y, x+w, y+h, rr);
  ctx.arcTo(x+w, y+h, x, y+h, rr);
  ctx.arcTo(x, y+h, x, y, rr);
  ctx.arcTo(x, y, x+w, y, rr);
  ctx.closePath();
}

function drawBackground(){
  context.save();
  context.clearRect(0,0,canvas.width,canvas.height);

  // soft glow
  const g = context.createRadialGradient(580, 120, 80, 400, 320, 680);
  g.addColorStop(0, "rgba(255,209,102,0.10)");
  g.addColorStop(1, "rgba(0,0,0,0)");
  context.fillStyle = g;
  context.fillRect(0,0,canvas.width,canvas.height);

  // stars
  context.globalAlpha = 0.18;
  context.fillStyle = "white";
  const t = Date.now()*0.02;
  for (let i=0;i<34;i++){
    const x = (i*97 + t) % canvas.width;
    const y = (i*53) % canvas.height;
    context.fillRect(x, y, 2, 2);
  }
  context.restore();

  // ground haze
  context.save();
  context.globalAlpha = 0.10;
  context.fillStyle = "#ffd166";
  context.fillRect(0, 520, canvas.width, 120);
  context.restore();
}

function blockColor(n){
  const palette = ["#ffd166","#ff8fab","#9bf6ff","#bdb2ff","#caffbf","#ffadad"];
  return palette[n % palette.length];
}

function drawBlock(box, n){
  const screenY = GROUND_Y - box.y + cameraY;
  const x = box.x;
  const y = screenY;

  // shadow
  context.save();
  context.globalAlpha = 0.25;
  context.fillStyle = "rgba(0,0,0,.55)";
  roundRect(context, x+2, y+6, box.width, height, RADIUS);
  context.fill();
  context.restore();

  // gradient fill
  const grad = context.createLinearGradient(x, y, x, y+height);
  const c = blockColor(n);
  grad.addColorStop(0, c);
  grad.addColorStop(1, "rgba(255,255,255,0.10)");

  context.save();
  context.fillStyle = grad;
  roundRect(context, x, y, box.width, height, RADIUS);
  context.fill();

  // border
  context.strokeStyle = "rgba(255,255,255,0.16)";
  context.lineWidth = 1;
  context.stroke();

  // highlight strip
  context.globalAlpha = 0.16;
  context.fillStyle = "#fff";
  roundRect(context, x+3, y+3, box.width-6, height*0.35, RADIUS-3);
  context.fill();

  context.restore();
}

function drawDebris(){
  if (!debris.width || debris.width === 0) return;
  const w = Math.abs(debris.width);
  const x = debris.x;
  const y = GROUND_Y - debris.y + cameraY;

  context.save();
  context.globalAlpha = 0.65;
  context.fillStyle = "rgba(255, 92, 122, 0.55)";
  roundRect(context, x, y, w, height, 10);
  context.fill();
  context.strokeStyle = "rgba(255,255,255,0.14)";
  context.stroke();
  context.restore();
}

function drawHUD(){
  const score = Math.max(0, current - 1);

  context.save();
  context.fillStyle = "rgba(15,23,48,0.65)";
  context.strokeStyle = "rgba(255,255,255,0.12)";
  context.lineWidth = 1;
  roundRect(context, 16, 14, canvas.width-32, 56, 16);
  context.fill();
  context.stroke();

  context.fillStyle = "rgba(255,255,255,0.90)";
  context.font = "700 18px system-ui, -apple-system, Segoe UI, Roboto, Arial";
  context.fillText("🧱 Stack Builder", 30, 28);

  context.font = "600 16px system-ui, -apple-system, Segoe UI, Roboto, Arial";
  context.fillStyle = "rgba(255,255,255,0.85)";
  context.fillText("Score: " + score, canvas.width - 170, 30);

  context.font = "500 12px system-ui, -apple-system, Segoe UI, Roboto, Arial";
  context.fillStyle = "rgba(185,192,255,0.90)";
  context.fillText("Tap / Click to drop", 30, 52);

  context.fillStyle = "rgba(255,209,102,0.95)";
  context.fillText("Goal: " + WIN_SCORE, canvas.width - 170, 50);

  context.restore();
}

function newBox() {
  boxes[current] = {
    x: 0,
    y: (current + 10) * height,
    width: boxes[current - 1].width
  };
}

function showWin(){
  mode = 'win';
  winOverlay.classList.add("show");
  // reset scroll to top each win
  loveBox.scrollTop = 0;
}

function showLose(reason){
  mode = 'gameOver';
  loseText.textContent = reason || "Your tower fell…";
  loseOverlay.classList.add("show");
}

function hideOverlays(){
  winOverlay.classList.remove("show");
  loseOverlay.classList.remove("show");
}

function animate() {
  // If overlays are showing, freeze gameplay updates but keep drawing scene
  drawBackground();
  for (let n = 0; n < boxes.length; n++) drawBlock(boxes[n], n);
  drawDebris();
  drawHUD();

  if (mode !== 'gameOver' && mode !== 'win') {
    if (mode === 'bounce') {
      boxes[current].x = boxes[current].x + xSpeed;
      if (xSpeed > 0 && boxes[current].x + boxes[current].width > canvas.width) xSpeed = -xSpeed;
      if (xSpeed < 0 && boxes[current].x < 0) xSpeed = -xSpeed;
    }

    if (mode === 'fall') {
      boxes[current].y = boxes[current].y - ySpeed;

      if (boxes[current].y === boxes[current - 1].y + height) {
        mode = 'bounce';
        let difference = boxes[current].x - boxes[current - 1].x;

        if (Math.abs(difference) >= boxes[current].width) {
          showLose("Missed completely 💥");
        }

        debris = { y: boxes[current].y, width: difference, x: debris.x };

        if (boxes[current].x > boxes[current - 1].x) {
          boxes[current].width = boxes[current].width - difference;
          debris.x = boxes[current].x + boxes[current].width;
        } else {
          debris.x = boxes[current].x - difference;
          boxes[current].width = boxes[current].width + difference;
          boxes[current].x = boxes[current - 1].x;
        }

        if (xSpeed > 0) xSpeed++;
        else xSpeed--;

        current++;
        scrollCounter = height;
        newBox();

        // ✅ WIN CHECK (score = current-1)
        if ((current - 1) >= WIN_SCORE) {
          showWin();
        }
      }
    }

    debris.y = debris.y - ySpeed;

    if (scrollCounter) {
      cameraY++;
      scrollCounter--;
    }
  }

  window.requestAnimationFrame(animate);
}

function restart() {
  hideOverlays();
  boxes.splice(1, boxes.length - 1);
  mode = 'bounce';
  cameraY = 0;
  scrollCounter = 0;
  xSpeed = 2;
  current = 1;
  newBox();
  debris.y = 0;
  debris.width = 0;
  debris.x = 0;
}

// Input (disable dropping while overlays are visible)
canvas.onpointerdown = function() {
  if (mode === 'gameOver' || mode === 'win') return; // use buttons instead
  if (mode === 'bounce') mode = 'fall';
};

// Buttons
playAgainBtn.onclick = restart;
tryAgainBtn.onclick = restart;

copyBtn.onclick = async () => {
  try{
    await navigator.clipboard.writeText(LOVE_MESSAGE);
    copyBtn.textContent = "Copied!";
    setTimeout(()=>copyBtn.textContent="Copy message", 1200);
  }catch(e){
    copyBtn.textContent = "Can't copy";
    setTimeout(()=>copyBtn.textContent="Copy message", 1200);
  }
};

// Start
restart();
animate();
</script>
</body>
</html>
