<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>For Her 💘</title>
    <style>
        body {
            margin: 0;
            height: 100dvh;
            /* Use dynamic viewport height for mobile browsers */
            display: grid;
            place-items: center;
            background: #0b1220;
            font-family: system-ui, Segoe UI, Roboto, Arial;
            overflow: hidden;
            /* Prevent scrolling */
            touch-action: none;
            /* Disable default touch actions like scroll/zoom */
        }

        canvas {
            width: min(100vw, 420px);
            /* Fill width on mobile */
            height: auto;
            max-height: 100dvh;
            border-radius: 14px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, .35);
            background: linear-gradient(#8dd7ff, #35b9ff);
            touch-action: none;
        }

        .hint {
            color: #cbd5e1;
            margin-top: 10px;
            font-size: 14px;
            text-align: center;
            opacity: .9;
            pointer-events: none;
            /* Let clicks pass through to canvas if needed */
        }

        /* Win Screen Overlay */
        #win-screen {
            display: none;
            /* hidden by default */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            backdrop-filter: blur(4px);
        }

        #win-box {
            background: rgba(255, 255, 255, 0.95);
            width: min(90vw, 340px);
            max-height: 80vh;
            border-radius: 18px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        #win-title {
            margin: 0 0 16px 0;
            font-size: 26px;
            font-weight: 900;
            color: #0b1220;
        }

        #win-message {
            flex: 1;
            overflow-y: auto;
            text-align: left;
            font-size: 15px;
            line-height: 1.5;
            color: #334155;
            margin-bottom: 20px;
            padding-right: 8px;
            /* Scrollbar styling */
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 transparent;
        }

        #win-message::-webkit-scrollbar {
            width: 6px;
        }

        #win-message::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 3px;
        }

        #restart-btn {
            background: #ff2d55;
            border: none;
            padding: 14px 20px;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s;
        }

        #restart-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>

<body>
    <div>
        <canvas id="c" width="360" height="640"></canvas>
        <div class="hint">Tap / Click / Space to flap · R to restart</div>
    </div>

    <!-- DOM-based Win Screen -->
    <div id="win-screen">
        <div id="win-box">
            <h2 id="win-title">Title</h2>
            <div id="win-message">Message goes here...</div>
            <button id="restart-btn">Restart Game</button>
        </div>
    </div>

    <script>
        (() => {
            const canvas = document.getElementById("c");
            const ctx = canvas.getContext("2d");
            const W = canvas.width, H = canvas.height;

            // ====== YOU CUSTOMIZE THESE ======
            const YOUR_IMAGE = "me.png";
            const HER_IMAGE = "her.png"; // change to "her.png" if needed

            // Place heart on her chest area (tweak these if needed)
            const HEART_OFFSET_X = 10;   // +right / -left relative to her image center
            const HEART_OFFSET_Y = 30;   // +down / -up relative to her image top

            // Romantic message (edit freely)
            const MESSAGE_TITLE = "For Bebu 💖";
            // Updated to be a single string for auto-wrapping
            const MESSAGE_TEXT = "Baby honestly mujhe samajh nahi aata mei kaise explain karu, but you have become such an important part of my life. Aur jab mei aapko nahi dekhta then har cheez kharab si lagne lag jati hai. Mood off ho jata hai, din incomplete sa feel hota hai. Aur jab mei aapko nahi dekhta, it feels like something is missing. Like my day is not even proper without you. Your laugh, seriously it makes everything better. Jab aap hasti ho na, mujhe lagta hai sab theek hai. Mei aapki itni care karta hu ki agar aap upset hoti ho, toh mujhe bhi chain nahi milta. Aur jab aap khana nahi khati, to I feel ki mei khud apne haath se khila sakta aapko. Aap meri motivation ban gayi ho. My reason to keep going, to keep living, to keep trying. Aapki presence mere dil ko pura light up kar deti hai. So, bebu, I ask you this, I have fallen so hard for you, so hard it hurts, so hard I cannot think straight, so hard that I can only, think about you, but I would like to know, if I have your permission, to fall even harder, even deeper in love with you?";

            // =================================

            // Simple physics/settings
            const GRAVITY = 0.38;
            const FLAP = -7.0;
            const SPEED = 2.4;

            const PIPE_W = 58;
            const GAP = 100;
            const FLOOR_H = 70;

            // Make it short: after 3-4 obstacles, show her
            const PIPES_BEFORE_HER = 19; // set 3 or 4

            // Images
            const imgMe = new Image();
            const imgHer = new Image();
            imgMe.src = YOUR_IMAGE;
            imgHer.src = HER_IMAGE;

            let running = false;
            let gameOver = false;
            let won = false;

            const bird = { x: 110, y: H * 0.42, r: 18, vy: 0 };

            let pipes = [];
            let passed = 0;

            // "Her" target
            let her = null; // {x,y,w,h}

            function rand(min, max) { return Math.random() * (max - min) + min; }

            function reset() {
                running = true; gameOver = false; won = false;
                bird.y = H * 0.42; bird.vy = 0;
                pipes = [];
                passed = 0;
                her = null;

                // spawn first pipes
                for (let i = 0; i < PIPES_BEFORE_HER; i++) {
                    spawnPipe(W + i * 210);
                }
            }

            function spawnPipe(x) {
                const topMargin = 70;
                const bottomMargin = FLOOR_H + 70;
                const gapY = rand(topMargin + GAP / 2, H - bottomMargin - GAP / 2);
                pipes.push({ x, gapY, scored: false });
            }

            function flap() {
                // If the user has won, input on the canvas is ignored.
                // Restart must be done via the button.
                if (won) return;

                if (gameOver) {
                    reset();
                    bird.vy = FLAP;
                    return;
                }
                if (!running) {
                    reset();
                    bird.vy = FLAP;
                    return;
                }
                bird.vy = FLAP;
            }

            // Button listener
            document.getElementById("restart-btn").addEventListener("click", (e) => {
                e.stopPropagation(); // prevent canvas click
                document.getElementById("win-screen").style.display = "none";
                reset();
                bird.vy = 0; // reset velocity properly
            });

            // Input
            window.addEventListener("keydown", (e) => {
                if (e.code === "Space") { e.preventDefault(); flap(); }
                if (e.key.toLowerCase() === "r") { reset(); }
            }, { passive: false });

            // Better touch support for mobile
            const handleTouch = (e) => {
                if (e.cancelable) e.preventDefault();
                flap();
            };
            canvas.addEventListener("touchstart", handleTouch, { passive: false });
            canvas.addEventListener("mousedown", flap);

            // Collision helper
            function circleRect(cx, cy, r, rx, ry, rw, rh) {
                const nx = Math.max(rx, Math.min(cx, rx + rw));
                const ny = Math.max(ry, Math.min(cy, ry + rh));
                const dx = cx - nx, dy = cy - ny;
                // slightly forgiving collision for rectangle bird image
                return dx * dx + dy * dy <= (r * 0.8) * (r * 0.8);
            }

            function endGame() {
                if (gameOver) return;
                gameOver = true;
                running = false;
            }

            function win() {
                won = true; running = false;
                // Show DOM overlay
                const winScreen = document.getElementById("win-screen");
                const winTitle = document.getElementById("win-title");
                const winMsg = document.getElementById("win-message");

                winTitle.innerText = MESSAGE_TITLE;
                winMsg.innerText = MESSAGE_TEXT;

                winScreen.style.display = "flex";
            }

            function update() {
                if (!running) return;

                // physics
                bird.vy += GRAVITY;
                bird.y += bird.vy;

                const floorY = H - FLOOR_H;

                // ceiling/floor
                if (bird.y - bird.r < 0) { bird.y = bird.r; bird.vy = 0; }
                if (bird.y + bird.r > floorY) { bird.y = floorY - bird.r; endGame(); }

                // move pipes until finished
                for (const p of pipes) p.x -= SPEED;

                // scoring / count passed obstacles
                for (const p of pipes) {
                    if (!p.scored && p.x + PIPE_W < bird.x) {
                        p.scored = true;
                        passed++;
                    }
                }

                // recycle pipes only until we spawn her
                // when enough pipes are passed, stop spawning new pipes and create her
                if (!her && passed >= PIPES_BEFORE_HER) {
                    // clear remaining pipes offscreen quickly
                    pipes = pipes.filter(p => p.x + PIPE_W > bird.x - 50);

                    // create her "target" on the right
                    const targetW = 170;
                    const targetH = 220;
                    her = {
                        x: W + 40,
                        y: Math.max(70, Math.min(floorY - targetH - 20, bird.y - targetH / 2)),
                        w: targetW,
                        h: targetH
                    };
                }

                // remove pipes that go offscreen
                pipes = pipes.filter(p => p.x + PIPE_W > -20);

                // If still in pipe phase and we need more pipes, keep a few ahead
                if (!her) {
                    const lastX = pipes.length ? pipes[pipes.length - 1].x : 0;
                    if (lastX < W + 250 && pipes.length < PIPES_BEFORE_HER) {
                        spawnPipe(Math.max(W + 120, lastX + 210));
                    }
                }

                // pipe collision
                for (const p of pipes) {
                    const topH = p.gapY - GAP / 2;
                    const botY = p.gapY + GAP / 2;
                    const botH = floorY - botY;

                    if (circleRect(bird.x, bird.y, bird.r, p.x, 0, PIPE_W, topH) ||
                        circleRect(bird.x, bird.y, bird.r, p.x, botY, PIPE_W, botH)) {
                        endGame();
                        return;
                    }
                }

                // Move her into scene and detect "reach"
                if (her) {
                    her.x -= SPEED;

                    // simple “reach” condition: your face touches her photo
                    if (circleRect(bird.x, bird.y, bird.r, her.x, her.y, her.w, her.h)) {
                        win();
                    }

                    // if you somehow miss and go too far, just end
                    if (her.x + her.w < -10) endGame();
                }
            }

            function drawBackground() {
                // sky already via canvas background; add simple clouds
                ctx.fillStyle = "rgba(255,255,255,0.8)";
                for (let i = 0; i < 5; i++) {
                    const x = (i * 90 + (Date.now() / 30)) % (W + 120) - 60;
                    const y = 70 + (i % 3) * 26;
                    ctx.beginPath();
                    ctx.arc(x, y, 16, 0, Math.PI * 2);
                    ctx.arc(x + 18, y - 10, 18, 0, Math.PI * 2);
                    ctx.arc(x + 38, y, 14, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function drawGround() {
                const floorY = H - FLOOR_H;
                ctx.fillStyle = "#a16207";
                ctx.fillRect(0, floorY, W, FLOOR_H);
                ctx.fillStyle = "#22c55e";
                ctx.fillRect(0, floorY, W, 16);
            }

            function drawPipes() {
                const floorY = H - FLOOR_H;
                for (const p of pipes) {
                    const topH = p.gapY - GAP / 2;
                    const botY = p.gapY + GAP / 2;
                    const botH = floorY - botY;

                    ctx.fillStyle = "#16a34a";
                    ctx.fillRect(p.x, 0, PIPE_W, topH);
                    ctx.fillRect(p.x, botY, PIPE_W, botH);

                    ctx.strokeStyle = "rgba(0,0,0,0.18)";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(p.x, 0, PIPE_W, topH);
                    ctx.strokeRect(p.x, botY, PIPE_W, botH);
                }
            }

            function drawBird() {
                // Draw image directly without circle clip/border
                const size = bird.r * 2.8; // slightly larger to compensate visual weight
                const x = bird.x - size / 2;
                const y = bird.y - size / 2;

                if (imgMe.complete && imgMe.naturalWidth) {
                    ctx.drawImage(imgMe, x, y, size, size);
                } else {
                    // fallback if image not loaded
                    ctx.beginPath();
                    ctx.arc(bird.x, bird.y, bird.r, 0, Math.PI * 2);
                    ctx.fillStyle = "#fbbf24";
                    ctx.fill();
                }
            }

            function drawHerTarget() {
                if (!her) return;

                // photo
                if (imgHer.complete && imgHer.naturalWidth) {
                    ctx.save();
                    // rounded rect clip
                    const r = 14;
                    roundRect(her.x, her.y, her.w, her.h, r);
                    ctx.clip();
                    ctx.drawImage(imgHer, her.x, her.y, her.w, her.h);
                    ctx.restore();

                    // border
                    ctx.strokeStyle = "rgba(255,255,255,0.85)";
                    ctx.lineWidth = 3;
                    roundRect(her.x, her.y, her.w, her.h, 14);
                    ctx.stroke();

                    // heart over her heart region (adjust offsets at top)
                    const heartX = her.x + her.w / 2 + HEART_OFFSET_X;
                    const heartY = her.y + HEART_OFFSET_Y + 60;

                    drawHeart(heartX, heartY, 16);
                } else {
                    // fallback box
                    ctx.fillStyle = "rgba(255,255,255,0.6)";
                    ctx.fillRect(her.x, her.y, her.w, her.h);
                }
            }

            function drawUI() {
                // small counter
                ctx.fillStyle = "rgba(15,23,42,0.75)";
                ctx.font = "700 16px system-ui,Segoe UI,Roboto,Arial";
                ctx.textAlign = "left";
                ctx.fillText(`Obstacles: ${Math.min(passed, PIPES_BEFORE_HER)}/${PIPES_BEFORE_HER}`, 12, 24);

                if (!running && !gameOver && !won) {
                    ctx.textAlign = "center";
                    ctx.font = "900 22px system-ui,Segoe UI,Roboto,Arial";
                    ctx.fillText("Tap to Start", W / 2, H / 2 - 10);
                    ctx.font = "600 14px system-ui,Segoe UI,Roboto,Arial";
                    ctx.fillText("After a few obstacles… she’s waiting 💘", W / 2, H / 2 + 18);
                }

                if (gameOver) {
                    overlayBox("Oops!", ["Try again 😄", "Tap to restart"], true);
                }

                if (won) {
                    // Do nothing here, DOM overlay handles it
                }
            }

            // Helper to wrap text
            function wrapText(context, text, maxWidth) {
                const words = text.split(' ');
                let lines = [];
                let currentLine = words[0];

                for (let i = 1; i < words.length; i++) {
                    const word = words[i];
                    const width = context.measureText(currentLine + " " + word).width;
                    if (width < maxWidth) {
                        currentLine += " " + word;
                    } else {
                        lines.push(currentLine);
                        currentLine = word;
                    }
                }
                lines.push(currentLine);
                return lines;
            }

            function overlayBox(title, lines, isShort) {
                ctx.fillStyle = "rgba(0,0,0,0.45)";
                ctx.fillRect(0, 0, W, H);

                const lineHeight = 20; // smaller font for long text
                const padding = 20;
                const titleHeight = 46;
                const footerHeight = 40;

                // Calculate dynamic height
                let contentHeight = lines.length * lineHeight;
                if (isShort) contentHeight = lines.length * 26; // taller lines for short messages

                let boxH = titleHeight + contentHeight + footerHeight + padding;
                // constrain max height
                boxH = Math.min(boxH, H - 40);

                const boxW = 300;
                const bx = (W - boxW) / 2, by = (H - boxH) / 2;

                ctx.fillStyle = "rgba(255,255,255,0.92)";
                roundRect(bx, by, boxW, boxH, 18);
                ctx.fill();

                ctx.fillStyle = "#0b1220";
                ctx.textAlign = "center";
                ctx.font = "900 24px system-ui,Segoe UI,Roboto,Arial";
                ctx.fillText(title, W / 2, by + titleHeight - 10);

                // Draw Text body
                if (isShort) {
                    ctx.font = "650 16px system-ui,Segoe UI,Roboto,Arial";
                } else {
                    ctx.font = "500 14px system-ui,Segoe UI,Roboto,Arial"; // smaller font for long love letter
                }

                let y = by + titleHeight + 20;
                for (const line of lines) {
                    ctx.fillText(line, W / 2, y);
                    y += isShort ? 26 : lineHeight;
                }

                ctx.font = "700 13px system-ui,Segoe UI,Roboto,Arial";
                ctx.fillStyle = "rgba(11,18,32,0.65)";
                ctx.fillText("Tap to play again", W / 2, by + boxH - 15);
            }

            function roundRect(x, y, w, h, r) {
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.arcTo(x + w, y, x + w, y + h, r);
                ctx.arcTo(x + w, y + h, x, y + h, r);
                ctx.arcTo(x, y + h, x, y, r);
                ctx.arcTo(x, y, x + w, y, r);
                ctx.closePath();
            }

            function drawHeart(x, y, s) {
                ctx.save();
                ctx.translate(x, y);
                ctx.beginPath();
                ctx.moveTo(0, s / 2);
                ctx.bezierCurveTo(0, 0, -s, 0, -s, -s / 2);
                ctx.bezierCurveTo(-s, -s * 1.2, 0, -s * 1.2, 0, -s / 2);
                ctx.bezierCurveTo(0, -s * 1.2, s, -s * 1.2, s, -s / 2);
                ctx.bezierCurveTo(s, 0, 0, 0, 0, s / 2);
                ctx.closePath();

                ctx.fillStyle = "#ff2d55";
                ctx.fill();
                ctx.strokeStyle = "rgba(0,0,0,0.18)";
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();
            }

            function draw() {
                ctx.clearRect(0, 0, W, H);
                drawBackground();
                drawPipes();
                drawHerTarget();
                drawGround();
                drawBird();
                drawUI();
            }

            function loop() {
                update();
                draw();
                requestAnimationFrame(loop);
            }

            // Start in idle screen
            running = false;
            draw();
            requestAnimationFrame(loop);

            // If images fail to load, still playable with fallback shapes
        })();
    </script>
</body>

</html>
